# ─────────────────────────────────────────────────────────────────────────────
# Facility Issue Tracker — close-one-issue agent.
#
# Fired by the Close button on a single ticket. It closes that ticket's GitHub
# issue and stamps `issue_closed_at` on the row, and does nothing else.
#
# Why a trigger rather than the app closing the issue itself: the app has no
# GitHub credential at all. Action Gateway holds it, and resolves a connection
# by actor — a trigger-started session runs as the DigitalOcean account UUID,
# which is the actor the connection is authorized against. A session the app
# created would run as the username actor and find nothing. Same reason the
# complaint and reset agents are triggers. See docs/PLATFORM-NOTES.md.
#
# Note that a trigger runs one execution at a time, so closing several tickets
# in quick succession shuts their issues about a minute apart. The ticket
# itself closes instantly either way — the app writes `closed_at` before this
# agent is even asked.
# ─────────────────────────────────────────────────────────────────────────────

name: issue-close
agent: opencode
description: Closes the GitHub issue for one ticket.

size: mars-1vcpu-1gb
persistent_workspace: false
idle_timeout: 5m

env:
  ANTHROPIC_BASE_URL: ${INFERENCE_BASE_URL}/v1
  ANTHROPIC_MODEL: ${INFERENCE_MODEL}
  HARNESS_INFERENCE_BASE_URL: ${INFERENCE_BASE_URL}/v1
  HARNESS_INFERENCE_MODEL: ${INFERENCE_MODEL}
  GITHUB_ISSUE_REPO: ${GITHUB_ISSUE_REPO}
  TICKET_TABLE: ${MARS_TICKET_TABLE}

secrets:
  ANTHROPIC_API_KEY: ${INFERENCE_API_KEY}

  # The same least-privilege role the complaint agent uses. Against this
  # agent it can do exactly one useful thing: stamp `issue_closed_at` on a
  # ticket it can otherwise not read. See db/grants.postgres.sql.
  MARS_DATABASE_URL: ${MARS_DATABASE_URL}

tools:
  # One tool. It cannot list issues, cannot open them, and has no delete —
  # Action Gateway does not expose one, which is the right way round for a
  # demo that should not be able to erase its own audit trail.
  - do.actions:
      tools: [github_update_issue]
      preload_tools: [github_update_issue]

permissions:
  # Scoped to one repository. The `match` map compares tool arguments, so a
  # create naming any other owner/repo is refused by the session policy
  # before it reaches Action Gateway — verified: a run pointed at a
  # different repo came back "denied by the session policy" rather than a
  # GitHub 404, which is how you tell policy from a bad repo name.
  #
  # ${GITHUB_ISSUE_OWNER} and ${GITHUB_ISSUE_NAME} are expanded by doctl at
  # create time, so the stored template holds literals. The reference says
  # match values must not contain $VAR expansions, and after expansion they
  # do not.
  #
  # enforcement: best-effort, not strict. A strict rule naming a tool the
  # adapter does not declare fails session creation outright, and opencode
  # declares no capability for named tool rules. best-effort is what the
  # platform actually honours here, and it did.
  default: allow
  rules:
    - tool: do.actions/github_update_issue
      match:
        owner: ${GITHUB_ISSUE_OWNER}
        repo: ${GITHUB_ISSUE_NAME}
      action: allow
      enforcement: best-effort
    - tool: do.actions/github_update_issue
      action: deny
      enforcement: best-effort
  filesystem:
    mode: workspace-write

egress: unrestricted
